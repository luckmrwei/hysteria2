name: Build ByteBridge macOS

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - hysteria-legacy

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Get version info
        id: version
        run: |
          echo "commit=$(git rev-parse --short HEAD)" >> $GITHUB_OUTPUT
          echo "date=$(date -u +%Y-%m-%dT%H:%M:%SZ)" >> $GITHUB_OUTPUT

      - name: Build darwin/arm64
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64
        run: |
          cd app
          go build -trimpath \
            -ldflags="-s -w \
              -X 'github.com/apernet/hysteria/app/v2/cmd.appVersion=${{ github.ref_name }}' \
              -X 'github.com/apernet/hysteria/app/v2/cmd.appDate=${{ steps.version.outputs.date }}' \
              -X 'github.com/apernet/hysteria/app/v2/cmd.appType=bytebridge' \
              -X 'github.com/apernet/hysteria/app/v2/cmd.appCommit=${{ steps.version.outputs.commit }}' \
              -X 'github.com/apernet/hysteria/app/v2/cmd.appPlatform=darwin' \
              -X 'github.com/apernet/hysteria/app/v2/cmd.appArch=universal'" \
            -o /tmp/hysteria-arm64 .

      - name: Build darwin/amd64
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: amd64
        run: |
          cd app
          go build -trimpath \
            -ldflags="-s -w \
              -X 'github.com/apernet/hysteria/app/v2/cmd.appVersion=${{ github.ref_name }}' \
              -X 'github.com/apernet/hysteria/app/v2/cmd.appDate=${{ steps.version.outputs.date }}' \
              -X 'github.com/apernet/hysteria/app/v2/cmd.appType=bytebridge' \
              -X 'github.com/apernet/hysteria/app/v2/cmd.appCommit=${{ steps.version.outputs.commit }}' \
              -X 'github.com/apernet/hysteria/app/v2/cmd.appPlatform=darwin' \
              -X 'github.com/apernet/hysteria/app/v2/cmd.appArch=universal'" \
            -o /tmp/hysteria-amd64 .

      - name: Lipo universal binary
        run: |
          lipo -create /tmp/hysteria-arm64 /tmp/hysteria-amd64 -output /tmp/hysteria-macos
          chmod +x /tmp/hysteria-macos
          file /tmp/hysteria-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hysteria-macos-universal
          path: /tmp/hysteria-macos
