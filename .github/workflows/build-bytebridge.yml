name: Build ByteBridge macOS

on:
  workflow_dispatch:
  push:
    branches:
      - hysteria-legacy

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26"

      - name: Build darwin/arm64
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: arm64
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          cd app
          go build -trimpath -ldflags="-s -w" -o /tmp/hysteria-arm64 .

      - name: Build darwin/amd64
        env:
          CGO_ENABLED: 0
          GOOS: darwin
          GOARCH: amd64
          MACOSX_DEPLOYMENT_TARGET: "10.15"
        run: |
          cd app
          go build -trimpath -ldflags="-s -w" -o /tmp/hysteria-amd64 .

      - name: Lipo universal binary
        run: |
          lipo -create /tmp/hysteria-arm64 /tmp/hysteria-amd64 -output /tmp/hysteria-macos
          chmod +x /tmp/hysteria-macos
          file /tmp/hysteria-macos

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: hysteria-macos-universal
          path: /tmp/hysteria-macos
